name: API Performance Testing (K6)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  k6-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Start Local Web Server
      run: |
        # Serve the static files in the background on port 8000
        nohup python -m http.server 8000 > server.log 2>&1 &
        sleep 2
        
    - name: Wait for Server to be Ready
      run: |
        python -c "
        import socket, time
        port = 8000
        start_time = time.time()
        while True:
            try:
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(1)
                s.connect(('127.0.0.1', port))
                s.close()
                print(f'Server Port {port} is open and ready.')
                break
            except Exception:
                if time.time() - start_time > 60:
                    raise TimeoutError(f'Timed out waiting for port {port}')
                print(f'Waiting for port {port}...')
                time.sleep(2)
        "

    - name: Install K6
      run: |
        curl -L -o k6.tar.gz https://github.com/grafana/k6/releases/download/v0.51.0/k6-v0.51.0-linux-amd64.tar.gz
        tar -xzf k6.tar.gz
        sudo mv k6-v0.51.0-linux-amd64/k6 /usr/local/bin/

    - name: Run K6 Load Tests
      run: |
        k6 run automation/tests/k6-test.js

    - name: Dump Server Logs (On Failure)
      if: failure()
      run: |
        echo "========================================================="
        echo "                DETAILED SERVER LOGS                     "
        echo "========================================================="
        if [ -f server.log ]; then
          cat server.log
        else
          echo "server.log not found"
        fi
