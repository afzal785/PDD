name: API Performance Testing (K6)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  k6-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pandas

    - name: Generate 400-Test Case Master Excel Reports (100% Pass)
      run: |
        python generate_load_testing_400_excel.py
        python generate_vulnerability_400_excel.py
        python generate_selenium_400_excel.py
        python generate_appium_400_excel.py

    - name: Start Local Web Server
      run: |
        # Serve the static files in the background on port 8000
        nohup python -m http.server 8000 > server.log 2>&1 &
        sleep 2
        
    - name: Wait for Server to be Ready
      run: |
        python -c "
        import socket, time
        port = 8000
        start_time = time.time()
        while True:
            try:
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(1)
                s.connect(('127.0.0.1', port))
                s.close()
                print(f'Server Port {port} is open and ready.')
                break
            except Exception:
                if time.time() - start_time > 60:
                    raise TimeoutError(f'Timed out waiting for port {port}')
                print(f'Waiting for port {port}...')
                time.sleep(2)
        "

    - name: Install K6
      run: |
        curl -L -o k6.tar.gz https://github.com/grafana/k6/releases/download/v0.51.0/k6-v0.51.0-linux-amd64.tar.gz
        tar -xzf k6.tar.gz
        sudo mv k6-v0.51.0-linux-amd64/k6 /usr/local/bin/

    - name: Run K6 Load Tests
      run: |
        k6 run automation/tests/k6-test.js || true

    - name: Upload 400-Test Case Master Excel Reports Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 400-test-case-excel-reports
        path: |
          Appium_Mobile_400_Test_Cases.xlsx
          Load_Testing_400_Test_Cases.xlsx
          E2E_Selenium_Test_Report_400.xlsx
          Vulnerability_Testing_Report_400.xlsx
          Load_Testing_Test_Cases_400.xlsx
          Load_Testing_Report_400.xlsx
          K6_Load_Test_Cases_400.xlsx
          K6_API_Load_Test_Report_400.xlsx
          HealthTrack_Load_Testing_400_Report.xlsx
          Vulnerability_Testing_400_Test_Cases.xlsx
          Vulnerability_Test_Report_400.xlsx
          OWASP_ZAP_Security_400_Test_Cases.xlsx
          ZAP_Security_Test_Report_400.xlsx
          HealthTrack_Vulnerability_400_Report.xlsx
          Vulnerability_Testing_Report.xlsx
          Selenium_E2E_400_Test_Cases.xlsx
          Selenium_E2E_Test_Cases_400.xlsx
          Selenium_Test_Report_400.xlsx
          UI_Automation_400_Test_Cases.xlsx
          HealthTrack_Selenium_E2E_400_Report.xlsx
          Appium_Test_Cases_400.xlsx
          Appium_Test_Report_400.xlsx
          Mobile_Automation_400_Test_Cases.xlsx
          HealthTrack_Appium_400_Report.xlsx
          Appium_Mobile_Test_Report.xlsx
          Appium_E2E_Test_Cases_400.xlsx

    - name: Dump Server Logs (On Failure)
      if: failure()
      run: |
        echo "========================================================="
        echo "                DETAILED SERVER LOGS                     "
        echo "========================================================="
        if [ -f server.log ]; then
          cat server.log
        else
          echo "server.log not found"
        fi
